name: Bug report
description: Something went wrong reading or changing a library
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `forscore-mcp doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: forScore's import preview (for CSV imports)
      description: A screenshot or the text of forScore's preview, if relevant.
  - type: input
    id: versions
    attributes:
      label: forScore and macOS versions
      placeholder: forScore 15.2.5, macOS 27.0
    validations:
      required: true
