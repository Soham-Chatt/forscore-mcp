[project]
name = "forscore-mcp"
version = "1.0.0"
description = "Read and clean up forScore library metadata from the CLI, an MCP server, or an LLM skill"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Soham", email = "113625563+Soham-Chatt@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["forscore", "mcp", "sheet-music", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/Soham-Chatt/forscore-mcp"
Documentation = "https://github.com/Soham-Chatt/forscore-mcp/blob/main/docs/reference.md"
Issues = "https://github.com/Soham-Chatt/forscore-mcp/issues"

[project.scripts]
forscore-mcp = "forscore_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# "›" separates score and bookmark names; "’" appears in real titles
allowed-confusables = ["›", "’"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["forscore_mcp"]
